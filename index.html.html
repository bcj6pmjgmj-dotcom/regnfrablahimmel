  html, body { height: 100%; margin: 0; }
  body { background: #9ec3e4; overflow: hidden; }
  /* soft blurred copy of the picture fills the sides on wide screens */
  #haze {
    position: fixed; inset: -10%;
    background: var(--pic) center / cover;
    filter: blur(40px) saturate(0.9);
    opacity: 0.9;
  }
  /* the picture: always full height, centered, 2:3 */
  #frame {
    position: fixed;
    top: 0;
    height: 100vh; height: 100svh;
    width: 66.667vh; width: 66.667svh;
    left: calc(50% - 33.333vh); left: calc(50% - 33.333svh);
    background: var(--pic) center / 100% 100% no-repeat;
    animation: drift 40s ease-in-out infinite alternate;
  }
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.035); } }
  @media (prefers-reduced-motion: reduce) { #frame { animation: none; } }
</style>
</head>
<body>
<div id="haze"></div>
<div id="frame" role="img" aria-label="En kvinne med oppsatt hår går gjennom en blomstereng med åpne hender, mens et mykt regn faller fra en klar blå himmel.">
  <canvas id="rain" aria-hidden="true"></canvas>
</div>

<script>
(function () {
  var frame = document.getElementById('frame');
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w, h, dpr, drops = [];

  /* ---- Settings you can tweak ---- */
  var AMOUNT   = 24;     // how many drops (0 = no extra rain at all)
  var STRENGTH = 0.6;    // how visible they are (0 = invisible, 1 = strong)
  var SPEED    = 0.8;    // 1 = calm, 2 = twice as fast
  var TOP      = 0.04;   // where the rain starts (0 = top of picture)
  var BOTTOM   = 0.30;   // where it has faded away
  /* -------------------------------- */

  function makeDrop(anywhere) {
    var depth = Math.random();
    return {
      x: 0.31 + Math.random() * 0.40,
      t: anywhere ? Math.random() : 0,
      len: 0.8 + depth * 1.2,
      rx: 0.6 + depth * 0.6,
      speed: (0.0011 + depth * 0.0018) * SPEED,
      alpha: (0.12 + depth * 0.25) * STRENGTH
    };
  }

  function size() {
    dpr = window.devicePixelRatio || 1;
    w = frame.clientWidth; h = frame.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drops = [];
    for (var i = 0; i < AMOUNT; i++) drops.push(makeDrop(true));
  }

  function hidden(x, y) {
    // fade the drops out behind her head and hair so none land on her
    var dx = (x - 0.50) / 0.11, dy = (y - 0.31) / 0.10;
    var d = dx * dx + dy * dy;
    var t = Math.min(1, Math.max(0, (d - 0.8) / 0.6));
    return t * t * (3 - 2 * t);
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
    ctx.shadowBlur = 2;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var fy = TOP + d.t * (BOTTOM - TOP);
      var fade = Math.min(1, d.t / 0.3) * Math.min(1, (1 - d.t) / 0.5) * hidden(d.x, fy);
      ctx.fillStyle = 'rgba(238, 246, 255,' + (d.alpha * fade) + ')';
      ctx.beginPath();
      ctx.ellipse(d.x * w, fy * h, d.rx, d.len * h / 900, 0, 0, Math.PI * 2);
      ctx.fill();
      if (!reduce) {
        d.t += d.speed;
        if (d.t >= 1) drops[i] = makeDrop(false);
      }
    }
    if (!reduce) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () { size(); if (reduce) draw(); });
  size();
  draw();
})();
</script>
</body>
